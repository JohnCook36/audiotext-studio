name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write  # required only for release asset upload on v* tags

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application and build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

      - name: Build self-contained GUI application
        run: python -m PyInstaller --noconfirm --clean audiotext.spec

      - name: Smoke-test compiled Windows worker
        run: python tests/smoke_frozen.py dist/AudioTextStudio/AudioTextStudio.exe

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows setup.exe
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          }
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem 'installer/AudioTextStudio_Setup_*.exe')) { throw 'Installer missing' }

      - name: Upload installer to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioTextStudio-Windows-Installer
          path: installer/AudioTextStudio_Setup_*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer in GitHub Releases for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = (Get-ChildItem 'installer/AudioTextStudio_Setup_*.exe' | Select-Object -First 1).FullName
          gh release view "$env:GITHUB_REF_NAME" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" "$setup" --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" "$setup" --title "AudioText Studio $env:GITHUB_REF_NAME" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }