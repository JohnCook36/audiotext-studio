name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Download pinned whisper.cpp sources
        run: git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git mobile/vendor/whisper.cpp
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable test APK
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: test -s mobile/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AudioTextStudio-Android-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
